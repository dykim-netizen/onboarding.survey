<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beyond Music · People Team 온보딩 설문</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>*{box-sizing:border-box;margin:0;padding:0;}body{background:#F7F4EF;font-family:sans-serif;color:#1A1A1A;}select,input,textarea,button{font-family:inherit;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const CORRECT_PW = "Qwermnbv00!";
const GAS_URL = "https://script.google.com/macros/s/AKfycbz5vPQnEC19FKBFawUcQXJaIr-E2HwNhVuSGxc9PIjff8zUFXXIVSh9tluRJV8ZKqc/exec";
const ROUNDS = ["3개월","6개월","1년"];
const Q_LABELS = [
  "조직 문화와 일하는 방식에 잘 적응하고 있다",
  "동료들과 편하게 소통하고 관계 형성이 잘 되고 있다",
  "현재 맡은 업무가 내 역할과 기대치에 맞게 주어지고 있다",
  "업무를 수행하는 데 필요한 정보와 지원을 충분히 받고 있다",
  "팀장(리더)과의 소통이 원활하며 필요할 때 도움을 받을 수 있다",
  "리더로부터 내 성장과 업무에 대한 피드백을 충분히 받고 있다",
];
const Q_SECTIONS = [
  { title: "🏢 조직 적응도", qs: [0,1] },
  { title: "💼 업무 만족도", qs: [2,3] },
  { title: "🤝 리더십 체감도", qs: [4,5] },
];
const ROUND_COLOR = {"3개월":"#A8D5FF","6개월":"#7AB648","1년":"#2D5016"};
const ROUND_BG = {"3개월":"#EFF8FF","6개월":"#E8F5D8","1년":"#D6ECC4"};

function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cbName = "cb_" + Date.now();
    window[cbName] = (data) => {
      resolve(data);
      delete window[cbName];
      const el = document.getElementById(cbName);
      if(el) el.remove();
    };
    const s = document.createElement("script");
    s.id = cbName;
    s.src = url + (url.includes("?")?"&":"?") + "callback=" + cbName;
    s.onerror = reject;
    document.body.appendChild(s);
  });
}

function App() {
  const [tab, setTab] = React.useState("survey");
  const [resultTab, setResultTab] = React.useState("trend");
  const [responses, setResponses] = React.useState([]);
  const [isAuth, setIsAuth] = React.useState(false);
  const [loading, setLoading] = React.useState(false);
  const [logoClicks, setLogoClicks] = React.useState(0);
  const [name, setName] = React.useState("");
  const [round, setRound] = React.useState("");
  const [scores, setScores] = React.useState([0,0,0,0,0,0]);
  const [text7, setText7] = React.useState("");
  const [text8, setText8] = React.useState("");
  const [submitted, setSubmitted] = React.useState(false);
  const [submitting, setSubmitting] = React.useState(false);
  const [pw, setPw] = React.useState("");
  const [pwError, setPwError] = React.useState(false);
  const [csvText, setCsvText] = React.useState("");
  const [csvOpen, setCsvOpen] = React.useState(false);
  const [expandedPerson, setExpandedPerson] = React.useState(null);

  function handleLogoClick() {
    const n = logoClicks+1; setLogoClicks(n);
    if(n>=5){setLogoClicks(0);setTab(isAuth?"results":"password");}
  }

  function setScore(qi,val){const n=[...scores];n[qi]=val;setScores(n);}

  async function submitSurvey() {
    if(!name.trim()||!round) return alert("이름과 시점을 입력해주세요!");
    for(let i=0;i<6;i++) if(!scores[i]) return alert(`Q${i+1}번 답변을 선택해주세요!`);
    if(!text7.trim()) return alert("7번 답변을 입력해주세요!");
    if(!text8.trim()) return alert("8번 답변을 입력해주세요!");
    setSubmitting(true);
    try {
      const params = new URLSearchParams({
        name: name.trim(), round, date: new Date().toLocaleDateString("ko-KR"),
        s0:scores[0], s1:scores[1], s2:scores[2], s3:scores[3], s4:scores[4], s5:scores[5],
        text7: text7||"없음", text8: text8||"없음"
      });
      await jsonp(`${GAS_URL}?${params.toString()}`);
      setSubmitted(true);
    } catch(e) {
      alert("제출 중 오류가 발생했어요. 다시 시도해주세요.");
    }
    setSubmitting(false);
  }

  function resetSurvey(){setName("");setRound("");setScores([0,0,0,0,0,0]);setText7("");setText8("");setSubmitted(false);setTab("survey");}

  async function checkPassword() {
    if(pw===CORRECT_PW){
      setIsAuth(true);setPwError(false);setPw("");setTab("results");
      setLoading(true);
      try {
        const data = await jsonp(`${GAS_URL}?action=read`);
        if(data.success) setResponses(data.data);
      } catch(e){ alert("데이터를 불러오지 못했어요."); }
      setLoading(false);
    } else { setPwError(true); setPw(""); }
  }

  function logout(){setIsAuth(false);setTab("survey");setResponses([]);}

  function downloadCSV(){
    const header=["이름","시점","날짜",...Q_LABELS.map((_,i)=>`Q${i+1}`),"평균","개선점","전달사항"];
    const rows=responses.map(r=>{
      const avg=(r.scores.reduce((a,b)=>a+b,0)/r.scores.length).toFixed(1);
      return[r.name,r.round,r.date,...r.scores,avg,r.text7,r.text8];
    });
    const csv=[header,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
    setCsvText(csv);setCsvOpen(true);
  }

  const byPerson={};
  responses.forEach(r=>{if(!byPerson[r.name])byPerson[r.name]={};byPerson[r.name][r.round]=r;});
  const personNames=Object.keys(byPerson);

  const roundAvgs=ROUNDS.map(rd=>{
    const rrs=responses.filter(r=>r.round===rd);
    if(!rrs.length)return null;
    const qAvgs=Q_LABELS.map((_,qi)=>rrs.map(r=>r.scores[qi]).reduce((a,b)=>a+b,0)/rrs.length);
    return{count:rrs.length,overall:(qAvgs.reduce((a,b)=>a+b,0)/qAvgs.length).toFixed(1),qAvgs};
  });

  const s={
    nav:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 32px",background:"#2D5016",color:"white"},
    logo:{fontFamily:"Georgia,serif",fontSize:17,cursor:"pointer",userSelect:"none"},
    navBtn:(a)=>({background:a?"#7AB648":"transparent",border:`1px solid ${a?"#7AB648":"rgba(255,255,255,0.3)"}`,color:"white",padding:"7px 18px",borderRadius:20,fontSize:13,cursor:"pointer"}),
    wrap:{maxWidth:680,margin:"40px auto",padding:"0 24px 80px"},
    hero:{textAlign:"center",marginBottom:40},
    tag:{display:"inline-block",background:"#E8F5D8",color:"#2D5016",fontSize:13,fontWeight:700,letterSpacing:2,textTransform:"uppercase",padding:"6px 16px",borderRadius:20,marginBottom:14},
    h1:{fontFamily:"Georgia,serif",fontSize:34,color:"#2D5016",marginBottom:10,lineHeight:1.2},
    muted:{fontSize:13,color:"#888",lineHeight:1.7},
    metaRow:{display:"flex",gap:12,marginBottom:36,flexWrap:"wrap"},
    input:{flex:1,minWidth:120,background:"white",border:"1.5px solid #E0DDD6",padding:"11px 14px",borderRadius:10,fontSize:14,color:"#1A1A1A",outline:"none"},
    secTitle:{fontSize:13,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",color:"#2D5016",marginBottom:14,paddingBottom:8,borderBottom:"2px solid #E8F5D8"},
    card:{background:"white",border:"1.5px solid #E0DDD6",borderRadius:14,padding:"14px 22px",marginBottom:14},
    qLabel:{fontSize:14,fontWeight:500,lineHeight:1.5,marginBottom:18,display:"flex",alignItems:"flex-start",gap:8},
    qNum:{display:"inline-flex",width:22,height:22,background:"#2D5016",color:"white",borderRadius:"50%",fontSize:11,fontWeight:700,alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1},
    scaleWrap:{display:"flex",gap:8},
    scaleBtn:(sel)=>({flex:1,aspectRatio:"1",border:`2px solid ${sel?"#2D5016":"#E0DDD6"}`,borderRadius:10,background:sel?"#2D5016":"#F7F4EF",color:sel?"white":"#999",fontWeight:700,fontSize:15,cursor:"pointer"}),
    scaleLabels:{display:"flex",justifyContent:"space-between",marginTop:6,fontSize:10,color:"#aaa"},
    textarea:{width:"100%",minHeight:90,border:"1.5px solid #E0DDD6",borderRadius:10,padding:"10px 14px",fontSize:13,color:"#1A1A1A",background:"#F7F4EF",resize:"vertical",outline:"none",lineHeight:1.6,boxSizing:"border-box"},
    submitBtn:{width:"100%",padding:15,background:"#2D5016",color:"white",border:"none",borderRadius:12,fontSize:15,fontWeight:700,cursor:submitting?"not-allowed":"pointer",marginTop:8,opacity:submitting?0.6:1},
    pwWrap:{maxWidth:380,margin:"100px auto",padding:"0 24px",textAlign:"center"},
    rWrap:{maxWidth:900,margin:"40px auto",padding:"0 24px 80px"},
    overlay:{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:24},
    modal:{background:"white",borderRadius:16,padding:28,width:"100%",maxWidth:480,display:"flex",flexDirection:"column"},
  };

  if(submitted) return (
    <div style={{fontFamily:"sans-serif",background:"#F7F4EF",minHeight:"100vh"}}>
      <nav style={s.nav}><div style={s.logo} onClick={handleLogoClick}>Beyond Music · People Team</div></nav>
      <div style={{textAlign:"center",marginTop:100,padding:"0 24px"}}>
        <div style={{fontSize:52,marginBottom:16}}>🌿</div>
        <div style={{fontFamily:"Georgia,serif",fontSize:28,color:"#2D5016",marginBottom:10}}>제출 완료!</div>
        <div style={{fontSize:14,color:"#888",marginBottom:28}}>소중한 의견 감사해요.<br/>피플팀이 꼼꼼히 확인할게요.</div>
        <button style={{...s.submitBtn,maxWidth:300,margin:"0 auto",display:"block"}} onClick={resetSurvey}>확인</button>
      </div>
    </div>
  );

  return (
    <div style={{fontFamily:"sans-serif",background:"#F7F4EF",minHeight:"100vh",color:"#1A1A1A"}}>
      {csvOpen && (
        <div style={s.overlay}>
          <div style={s.modal}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div style={{fontFamily:"Georgia,serif",fontSize:18,color:"#2D5016"}}>📋 CSV 데이터</div>
              <button style={{background:"transparent",border:"none",fontSize:20,cursor:"pointer",color:"#888"}} onClick={()=>setCsvOpen(false)}>✕</button>
            </div>
            <div style={{fontSize:12,color:"#888",marginBottom:12}}>전체 선택 후 복사해서 엑셀에 붙여넣기 하세요.</div>
            <textarea readOnly value={csvText} style={{fontFamily:"monospace",fontSize:11,border:"1.5px solid #E0DDD6",borderRadius:8,padding:12,resize:"none",background:"#F7F4EF",color:"#1A1A1A",lineHeight:1.6,minHeight:200,width:"100%"}} onClick={e=>e.target.select()}/>
            <button style={{marginTop:12,background:"#2D5016",color:"white",border:"none",padding:10,borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer"}} onClick={()=>navigator.clipboard.writeText(csvText).then(()=>alert("복사됐어요!"))}>복사하기</button>
          </div>
        </div>
      )}

      <nav style={s.nav}>
        <div style={s.logo} onClick={handleLogoClick}>Beyond Music · People Team</div>
        <div style={{display:"flex",gap:8}}>
          <button style={s.navBtn(tab==="survey")} onClick={()=>setTab("survey")}>📝 설문 작성</button>
          {(tab==="results"||tab==="password")&&<button style={s.navBtn(true)} onClick={()=>setTab(isAuth?"results":"password")}>📊 응답 결과</button>}
        </div>
      </nav>

      {tab==="survey" && (
        <div style={s.wrap}>
          <div style={s.hero}>
            <div style={s.tag}>Onboarding Survey</div>
            <div style={s.h1}>지금 어떠세요?</div>
            <div style={s.muted}>솔직한 답변이 비욘드뮤직을 더 좋은 곳으로 만들어요.<br/>3개월 · 6개월 · 1년 단계별로 여러분의 성장을 함께 기록해요 🌿</div>
          </div>
          <div style={s.metaRow}>
            <input style={s.input} placeholder="이름을 입력해주세요" value={name} onChange={e=>setName(e.target.value)}/>
            <select style={s.input} value={round} onChange={e=>setRound(e.target.value)}>
              <option value="">시점 선택</option>
              {ROUNDS.map(r=><option key={r} value={r}>{r} 차</option>)}
            </select>
          </div>
          {Q_SECTIONS.map(section=>(
            <div key={section.title} style={{marginBottom:36}}>
              <div style={s.secTitle}>{section.title}</div>
              {section.qs.map(qi=>(
                <div key={qi} style={s.card}>
                  <div style={s.qLabel}><span style={s.qNum}>{qi+1}</span><span>{Q_LABELS[qi]}</span></div>
                  <div style={s.scaleWrap}>{[1,2,3,4,5].map(v=><button key={v} style={s.scaleBtn(scores[qi]===v)} onClick={()=>setScore(qi,v)}>{v}</button>)}</div>
                  <div style={s.scaleLabels}><span>전혀 그렇지 않다</span><span>매우 그렇다</span></div>
                </div>
              ))}
            </div>
          ))}
          <div style={{marginBottom:36}}>
            <div style={s.secTitle}>💬 건의사항 & 자유 의견</div>
            <div style={s.card}>
              <div style={s.qLabel}><span style={s.qNum}>7</span><span>온보딩 과정에서 아쉬웠거나 개선되었으면 하는 점이 있다면 적어주세요.</span></div>
              <textarea style={s.textarea} placeholder="" value={text7} onChange={e=>setText7(e.target.value)}/>
            </div>
            <div style={s.card}>
              <div style={s.qLabel}><span style={s.qNum}>8</span><span>피플팀 또는 회사에 전달하고 싶은 이야기가 있다면 편하게 적어주세요.</span></div>
              <textarea style={s.textarea} placeholder="" value={text8} onChange={e=>setText8(e.target.value)}/>
            </div>
          </div>
          <button style={s.submitBtn} onClick={submitting?undefined:submitSurvey} disabled={submitting}>
            {submitting?"제출 중...":"제출하기 →"}
          </button>
        </div>
      )}

      {tab==="password" && (
        <div style={s.pwWrap}>
          <div style={{fontSize:48,marginBottom:16}}>🔒</div>
          <div style={{fontFamily:"Georgia,serif",fontSize:24,color:"#2D5016",marginBottom:8}}>피플팀 전용</div>
          <div style={{fontSize:13,color:"#888",lineHeight:1.7,marginBottom:28}}>응답 결과는 피플팀만 확인할 수 있어요.<br/>비밀번호를 입력해주세요.</div>
          <div style={{display:"flex",gap:8,marginBottom:8}}>
            <input style={{...s.input,flex:1}} type="password" placeholder="비밀번호 입력" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&checkPassword()}/>
            <button style={{background:"#2D5016",color:"white",border:"none",padding:"12px 20px",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer"}} onClick={checkPassword}>확인</button>
          </div>
          {pwError&&<div style={{fontSize:13,color:"#C0392B",marginTop:6}}>⚠️ 비밀번호가 틀렸어요!</div>}
        </div>
      )}

      {tab==="results" && isAuth && (
        <div style={s.rWrap}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:24,flexWrap:"wrap",gap:12}}>
            <div style={{fontFamily:"Georgia,serif",fontSize:26,color:"#2D5016"}}>응답 결과</div>
            <div style={{display:"flex",gap:8}}>
              <button style={{background:"#2D5016",border:"none",color:"white",padding:"8px 14px",borderRadius:8,fontSize:12,cursor:"pointer"}} onClick={downloadCSV}>⬇️ CSV 다운로드</button>
              <button style={{background:"transparent",border:"1.5px solid #E0DDD6",color:"#888",padding:"8px 14px",borderRadius:8,fontSize:12,cursor:"pointer"}} onClick={logout}>나가기</button>
            </div>
          </div>
          <div style={{display:"flex",gap:8,marginBottom:28}}>
            {[["trend","📈 추이 비교"],["avg","📊 시점별 평균"],["list","📋 전체 응답"]].map(([k,l])=>(
              <button key={k} style={{padding:"9px 18px",borderRadius:20,border:`1.5px solid ${resultTab===k?"#2D5016":"#E0DDD6"}`,background:resultTab===k?"#2D5016":"white",color:resultTab===k?"white":"#555",fontSize:13,fontWeight:600,cursor:"pointer"}} onClick={()=>setResultTab(k)}>{l}</button>
            ))}
          </div>
          {loading?(
            <div style={{textAlign:"center",padding:60,color:"#888"}}>
              <div style={{fontSize:32,marginBottom:12}}>⏳</div>
              <div>데이터 불러오는 중...</div>
            </div>
          ):responses.length===0?(
            <div style={{textAlign:"center",padding:60,color:"#888"}}>
              <div style={{fontSize:40,marginBottom:12}}>📭</div>
              <div>아직 응답이 없어요!</div>
            </div>
          ):(
            <>
              {resultTab==="trend" && (
                <div>
                  <div style={{fontSize:13,color:"#888",marginBottom:20,lineHeight:1.7}}>구성원별로 <strong>3개월 → 6개월 → 1년</strong>의 평균 점수 변화를 한눈에 확인하세요.<br/>카드를 클릭하면 문항별 점수도 볼 수 있어요.</div>
                  {personNames.map(pname=>{
                    const pdata=byPerson[pname];
                    const roundsWithData=ROUNDS.filter(rd=>pdata[rd]);
                    const avgsPerRound=ROUNDS.map(rd=>pdata[rd]?(pdata[rd].scores.reduce((a,b)=>a+b,0)/pdata[rd].scores.length):null);
                    const isExpanded=expandedPerson===pname;
                    return(
                      <div key={pname} style={{background:"white",border:"1.5px solid #E0DDD6",borderRadius:16,marginBottom:16,overflow:"hidden"}}>
                        <div style={{padding:"18px 24px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between"}} onClick={()=>setExpandedPerson(isExpanded?null:pname)}>
                          <div style={{display:"flex",alignItems:"center",gap:14,flex:1}}>
                            <div>
                              <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>{pname}</div>
                              <div style={{display:"flex",gap:6}}>
                                {ROUNDS.map(rd=>(
                                  <span key={rd} style={{fontSize:11,padding:"2px 9px",borderRadius:20,background:pdata[rd]?ROUND_BG[rd]:"#F0EDE6",color:pdata[rd]?ROUND_COLOR[rd]==="#A8D5FF"?"#2980B9":ROUND_COLOR[rd]:"#ccc",fontWeight:600,border:`1px solid ${pdata[rd]?ROUND_COLOR[rd]:"#E0DDD6"}`}}>
                                    {rd}{pdata[rd]?"✓":""}
                                  </span>
                                ))}
                              </div>
                            </div>
                            <div style={{textAlign:"right",marginLeft:"auto"}}>
                              <div style={{fontSize:11,color:"#888"}}>{roundsWithData.length}/3 완료</div>
                              <div style={{fontSize:12,marginTop:4}}>{roundsWithData.length===3?"🏆":roundsWithData.length===2?"🌱":"🌾"}</div>
                            </div>
                          </div>
                          <div style={{fontSize:18,color:"#aaa",marginLeft:16}}>{isExpanded?"▲":"▼"}</div>
                        </div>
                        {isExpanded&&(
                          <div style={{borderTop:"1.5px solid #F0EDE6",padding:"20px 24px",background:"#FAFAF7"}}>
                            <div style={{overflowX:"auto"}}>
                              <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                                <thead>
                                  <tr>
                                    <th style={{textAlign:"left",padding:"8px 12px",color:"#888",fontWeight:600,fontSize:11,borderBottom:"1.5px solid #E0DDD6",minWidth:200}}>문항</th>
                                    {ROUNDS.map(rd=><th key={rd} style={{textAlign:"center",padding:"8px 12px",color:ROUND_COLOR[rd]==="#A8D5FF"?"#2980B9":ROUND_COLOR[rd],fontWeight:700,fontSize:11,borderBottom:"1.5px solid #E0DDD6",whiteSpace:"nowrap"}}>{rd} 차</th>)}
                                  </tr>
                                </thead>
                                <tbody>
                                  {Q_LABELS.map((ql,qi)=>(
                                    <tr key={qi} style={{background:qi%2===0?"white":"#F7F4EF"}}>
                                      <td style={{padding:"9px 12px",fontSize:12,borderBottom:"1px solid #F0EDE6",lineHeight:1.4}}>Q{qi+1}. {ql}</td>
                                      {ROUNDS.map(rd=>(
                                        <td key={rd} style={{textAlign:"center",padding:"9px 12px",borderBottom:"1px solid #F0EDE6"}}>
                                          {pdata[rd]?<span style={{fontWeight:700,fontSize:15,color:pdata[rd].scores[qi]>=4?"#2D5016":pdata[rd].scores[qi]===3?"#888":"#C0392B"}}>{pdata[rd].scores[qi]}</span>:<span style={{color:"#ddd"}}>—</span>}
                                        </td>
                                      ))}
                                    </tr>
                                  ))}
                                  <tr style={{background:"#E8F5D8"}}>
                                    <td style={{padding:"10px 12px",fontWeight:700,fontSize:12}}>📊 평균</td>
                                    {ROUNDS.map(rd=><td key={rd} style={{textAlign:"center",padding:"10px 12px",fontWeight:700,fontSize:14,color:"#2D5016"}}>{pdata[rd]?(pdata[rd].scores.reduce((a,b)=>a+b,0)/pdata[rd].scores.length).toFixed(1):"—"}</td>)}
                                  </tr>
                                </tbody>
                              </table>
                            </div>
                            {ROUNDS.filter(rd=>pdata[rd]).map(rd=>(
                              <div key={rd} style={{marginTop:16}}>
                                <div style={{fontSize:11,fontWeight:700,color:ROUND_COLOR[rd]==="#A8D5FF"?"#2980B9":ROUND_COLOR[rd],marginBottom:6}}>{rd} 차 ({pdata[rd].date})</div>
                                {pdata[rd].text7!=="없음"&&<div style={{fontSize:12,color:"#888",background:"white",padding:"8px 12px",borderRadius:8,border:"1px solid #E0DDD6",marginBottom:6}}>💬 {pdata[rd].text7}</div>}
                                {pdata[rd].text8!=="없음"&&<div style={{fontSize:12,color:"#888",background:"white",padding:"8px 12px",borderRadius:8,border:"1px solid #E0DDD6"}}>📣 {pdata[rd].text8}</div>}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
              {resultTab==="avg" && (
                <div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16,marginBottom:28}}>
                    {ROUNDS.map((rd,ri)=>{
                      const data=roundAvgs[ri];
                      return(
                        <div key={rd} style={{background:"white",border:`2px solid ${ROUND_COLOR[rd]}`,borderRadius:14,padding:20,textAlign:"center"}}>
                          <div style={{fontSize:11,fontWeight:700,color:ROUND_COLOR[rd]==="#A8D5FF"?"#2980B9":ROUND_COLOR[rd],marginBottom:8}}>{rd} 차</div>
                          <div style={{fontFamily:"Georgia,serif",fontSize:36,color:"#2D5016",lineHeight:1}}>{data?data.overall:"—"}</div>
                          <div style={{fontSize:11,color:"#aaa",marginTop:6}}>{data?`${data.count}명 응답`:"응답 없음"}</div>
                        </div>
                      );
                    })}
                  </div>
                  <div style={{background:"white",border:"1.5px solid #E0DDD6",borderRadius:14,padding:24}}>
                    <div style={{fontSize:13,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",color:"#2D5016",marginBottom:18,paddingBottom:8,borderBottom:"2px solid #E8F5D8"}}>📊 문항별 시점 비교</div>
                    {Q_LABELS.map((ql,qi)=>(
                      <div key={qi} style={{marginBottom:20}}>
                        <div style={{fontSize:12,fontWeight:600,marginBottom:10,color:"#333"}}>Q{qi+1}. {ql}</div>
                        {ROUNDS.map((rd,ri)=>{
                          const data=roundAvgs[ri];
                          const val=data?data.qAvgs[qi]:null;
                          const pct=val?val/5*100:0;
                          return(
                            <div key={rd} style={{display:"flex",alignItems:"center",gap:12,marginBottom:6}}>
                              <div style={{width:40,fontSize:11,fontWeight:700,color:ROUND_COLOR[rd]==="#A8D5FF"?"#2980B9":ROUND_COLOR[rd],flexShrink:0}}>{rd}</div>
                              <div style={{flex:1,height:10,background:"#F0EDE6",borderRadius:6,overflow:"hidden",position:"relative"}}>
                                {val&&<div style={{height:"100%",width:`${pct}%`,background:ROUND_COLOR[rd]==="#A8D5FF"?"#A8D5FF":ROUND_COLOR[rd],borderRadius:6}}/>}
                                <div style={{position:"absolute",top:-2,left:"60%",width:2,height:14,background:"#E67E22"}}/>
                              </div>
                              <div style={{width:32,textAlign:"right",fontSize:12,fontWeight:700,color:val?"#2D5016":"#ccc"}}>{val?val.toFixed(1):"—"}</div>
                            </div>
                          );
                        })}
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {resultTab==="list" && (
                <div style={{background:"white",border:"1.5px solid #E0DDD6",borderRadius:14,overflow:"hidden"}}>
                  <div style={{padding:"18px 24px",borderBottom:"1.5px solid #E0DDD6",fontSize:13,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",color:"#2D5016"}}>📋 전체 응답 ({responses.length}건)</div>
                  {[...responses].reverse().map((r,idx)=>{
                    const rowAvg=(r.scores.reduce((a,b)=>a+b,0)/r.scores.length).toFixed(1);
                    return(
                      <div key={r.id} style={{padding:"18px 24px",borderBottom:"1px solid #F0EDE6",background:idx%2===0?"white":"#FAFAF7"}}>
                        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,flexWrap:"wrap"}}>
                          <div style={{fontWeight:700,fontSize:14}}>{r.name}</div>
                          <span style={{fontSize:11,padding:"2px 9px",borderRadius:20,background:ROUND_BG[r.round],color:ROUND_COLOR[r.round]==="#A8D5FF"?"#2980B9":ROUND_COLOR[r.round],fontWeight:600,border:`1px solid ${ROUND_COLOR[r.round]}`}}>{r.round} 차</span>
                          <span style={{fontSize:12,fontWeight:700,color:"#2D5016"}}>평균 {rowAvg}</span>
                          <div style={{fontSize:11,color:"#aaa",marginLeft:"auto"}}>{r.date}</div>
                        </div>
                        <div style={{marginBottom:8}}>
                          {Q_LABELS.map((_,i)=>(
                            <span key={i} style={{fontSize:11,padding:"3px 8px",borderRadius:6,background:"#F7F4EF",border:"1px solid #E0DDD6",marginRight:6,marginBottom:4,display:"inline-block"}}>
                              Q{i+1} <strong style={{color:r.scores[i]>=4?"#2D5016":r.scores[i]===3?"#888":"#C0392B"}}>{r.scores[i]}</strong>
                            </span>
                          ))}
                        </div>
                        {r.text7!=="없음"&&<div style={{fontSize:12,color:"#888",background:"white",padding:"8px 12px",borderRadius:8,border:"1px solid #E0DDD6",marginBottom:6,lineHeight:1.6}}>💬 {r.text7}</div>}
                        {r.text8!=="없음"&&<div style={{fontSize:12,color:"#888",background:"white",padding:"8px 12px",borderRadius:8,border:"1px solid #E0DDD6",lineHeight:1.6}}>📣 {r.text8}</div>}
                      </div>
                    );
                  })}
                </div>
              )}
            </>
          )}
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
